<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard de Plataformas de IA</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --card-bg: white;
            --text-primary: #333;
            --text-secondary: #666;
            --text-tertiary: #999;
            --border-color: #e0e0e0;
            --input-bg: white;
            --modal-bg: white;
            --table-header-bg: #667eea;
            --table-header-text: white;
            --table-border: #e0e0e0;
            --table-even: #f9f9f9;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            --shadow-hover: 0 8px 12px rgba(0, 0, 0, 0.15);
        }

        [data-theme="dark"] {
            --bg-gradient: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            --card-bg: #1e1e2e;
            --text-primary: #e0e0e0;
            --text-secondary: #b0b0b0;
            --text-tertiary: #808080;
            --border-color: #3a3a4a;
            --input-bg: #2a2a3a;
            --modal-bg: #1e1e2e;
            --table-header-bg: #667eea;
            --table-header-text: white;
            --table-border: #3a3a4a;
            --table-even: #2a2a3a;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            --shadow-hover: 0 8px 12px rgba(0, 0, 0, 0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            padding: 20px;
            transition: background 0.3s ease;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            color: var(--text-primary);
            margin-bottom: 10px;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .theme-toggle {
            background: var(--input-bg);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            padding: 10px 15px;
            cursor: pointer;
            font-size: 24px;
            color: var(--text-primary);
            transition: all 0.3s;
        }

        .theme-toggle:hover {
            border-color: #667eea;
        }

        .controls {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .search-box {
            flex: 1;
            min-width: 200px;
        }

        .search-box input {
            width: 100%;
            padding: 10px 15px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            background: var(--input-bg);
            color: var(--text-primary);
        }

        .search-box input:focus {
            outline: none;
            border-color: #667eea;
        }

        .filter-select {
            padding: 10px 15px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            background: var(--input-bg);
            color: var(--text-primary);
        }

        .filter-select:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            box-shadow: var(--shadow);
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-hover);
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .card-icon {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
            font-weight: bold;
        }

        .card-title {
            font-size: 18px;
            font-weight: bold;
            color: var(--text-primary);
        }

        .card-category {
            font-size: 12px;
            color: var(--text-tertiary);
            margin-top: 5px;
        }

        .card-description {
            color: var(--text-secondary);
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 15px;
        }

        .card-price {
            background: var(--input-bg);
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
        }

        .card-price-label {
            font-weight: bold;
            color: var(--text-primary);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--modal-bg);
            border-radius: 12px;
            max-width: 800px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 30px;
            margin: 20px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--border-color);
        }

        .modal-title {
            font-size: 24px;
            font-weight: bold;
            color: var(--text-primary);
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 30px;
            cursor: pointer;
            color: var(--text-tertiary);
        }

        .close-btn:hover {
            color: var(--text-primary);
        }

        .modal-section {
            margin-bottom: 20px;
        }

        .modal-section h3 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 18px;
        }

        .modal-section p {
            color: var(--text-secondary);
            line-height: 1.6;
        }

        .modal-section a {
            color: #667eea;
            text-decoration: none;
        }

        .modal-section a:hover {
            text-decoration: underline;
        }

        .price-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        .price-table th,
        .price-table td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid var(--table-border);
            color: var(--text-primary);
        }

        .price-table th {
            background: var(--input-bg);
            font-weight: bold;
            color: var(--text-primary);
        }

        .comparison-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        .comparison-table th,
        .comparison-table td {
            padding: 12px;
            text-align: center;
            border: 1px solid var(--table-border);
            color: var(--text-primary);
        }

        .comparison-table th {
            background: var(--table-header-bg);
            color: var(--table-header-text);
        }

        .comparison-table tr:nth-child(even) {
            background: var(--table-even);
        }

        .selected-count {
            background: #667eea;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
        }

        .no-results {
            text-align: center;
            padding: 40px;
            color: var(--text-tertiary);
            font-size: 18px;
        }

        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }

            .controls {
                flex-direction: column;
                align-items: stretch;
            }
        }
    </style>
</head>

        // Função para renderizar as plataformas
        function renderPlatforms(platformsToRender) {
            const grid = document.getElementById('platformsGrid');
            grid.innerHTML = '';

            if (platformsToRender.length === 0) {
                grid.innerHTML = '<div class="no-results">Nenhuma plataforma encontrada</div>';
                return;
            }

            platformsToRender.forEach(platform => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-header">
                        <div class="card-icon">${platform.name.charAt(0)}</div>
                        <div>
                            <div class="card-title">${platform.name}</div>
                            <div class="card-category">${getCategoryName(platform.category)}</div>
                        </div>
                    </div>
                    <div class="card-description">${platform.description.substring(0, 150)}...</div>
                    <div class="card-price">
                        <div class="card-price-label">Preço:</div>
                        ${getPriceSummary(platform)}
                    </div>
                `;
                
                card.addEventListener('click', () => showDetail(platform));
                card.addEventListener('contextmenu', (e) => {
                    e.preventDefault();
                    toggleSelection(platform.id);
                });
                
                grid.appendChild(card);
            });
        }

        function getCategoryName(category) {
            const names = {
                'platform': 'Plataforma de IA',
                'devtools': 'Ferramenta de Desenvolvimento',
                'chinese': 'Plataforma Chinesa',
                'concept': 'Conceito Técnico'
            };
            return names[category] || category;
        }

        function getPriceSummary(platform) {
            if (platform.category === 'concept') {
                return 'Open Source / Variable';
            }
            
            const firstModel = Object.keys(platform.pricing)[0];
            const pricing = platform.pricing[firstModel];
            
            if (pricing.price) {
                return `$${pricing.price}/mês`;
            }
            
            if (pricing.input && pricing.output) {
                return `Input: $${pricing.input}/M, Output: $${pricing.output}/M`;
            }
            
            return 'Consulte detalhes';
        }

        function showDetail(platform) {
            const modal = document.getElementById('detailModal');
            const title = document.getElementById('modalTitle');
            const body = document.getElementById('modalBody');

            title.textContent = platform.name;
            
            let pricingHTML = '<table class="price-table"><thead><tr><th>Modelo</th><th>Input</th><th>Output</th></tr></thead><tbody>';
            
            for (const [model, pricing] of Object.entries(platform.pricing)) {
                if (pricing.price) {
                    pricingHTML += `<tr><td>${model}</td><td colspan="2">$${pricing.price}/mês</td></tr>`;
                } else if (pricing.input !== undefined) {
                    pricingHTML += `<tr><td>${model}</td><td>$${pricing.input}/M</td><td>$${pricing.output}/M</td></tr>`;
                } else {
                    pricingHTML += `<tr><td>${model}</td><td colspan="2">${JSON.stringify(pricing)}</td></tr>`;
                }
            }
            pricingHTML += '</tbody></table>';

            body.innerHTML = `
                <div class="modal-section">
                    <h3>Descrição</h3>
                    <p>${platform.description}</p>
                </div>
                <div class="modal-section">
                    <h3>Modelos</h3>
                    <p>${platform.models.join(', ')}</p>
                </div>
                <div class="modal-section">
                    <h3>Preços</h3>
                    ${pricingHTML}
                </div>
                <div class="modal-section">
                    <h3>Link</h3>
                    <p><a href="${platform.link}" target="_blank">${platform.link}</a></p>
                </div>
                <div class="modal-section">
                    <button class="btn btn-primary" onclick="toggleSelection(${platform.id}); document.getElementById('detailModal').classList.remove('active');">
                        ${selectedPlatforms.has(platform.id) ? 'Remover da Comparação' : 'Adicionar à Comparação'}
                    </button>
                </div>
            `;

            modal.classList.add('active');
        }

        function toggleSelection(id) {
            if (selectedPlatforms.has(id)) {
                selectedPlatforms.delete(id);
            } else {
                selectedPlatforms.add(id);
            }
            updateSelectedCount();
        }

        function updateSelectedCount() {
            document.getElementById('selectedCount').textContent = selectedPlatforms.size;
        }

        function showComparison() {
            if (selectedPlatforms.size < 2) {
                alert('Selecione pelo menos 2 plataformas para comparar');
                return;
            }

            const modal = document.getElementById('compareModal');
            const body = document.getElementById('compareBody');
            
            const selected = platforms.filter(p => selectedPlatforms.has(p.id));
            
            let html = '<table class="comparison-table"><thead><tr><th>Plataforma</th>';
            selected.forEach(p => {
                html += `<th>${p.name}</th>`;
            });
            html += '</tr></thead><tbody>';
            
            html += '<tr><td>Categoria</td>';
            selected.forEach(p => {
                html += `<td>${getCategoryName(p.category)}</td>`;
            });
            html += '</tr>';
            
            html += '<tr><td>Modelos</td>';
            selected.forEach(p => {
                html += `<td>${p.models.slice(0, 3).join(', ')}${p.models.length > 3 ? '...' : ''}</td>`;
            });
            html += '</tr>';
            
            html += '<tr><td>Preço Mínimo</td>';
            selected.forEach(p => {
                const firstModel = Object.keys(p.pricing)[0];
                const pricing = p.pricing[firstModel];
                if (pricing.price) {
                    html += `<td>$${pricing.price}/mês</td>`;
                } else if (pricing.input) {
                    html += `<td>$${pricing.input}/M input</td>`;
                } else {
                    html += `<td>Variable</td>`;
                }
            });
            html += '</tr>';
            
            html += '</tbody></table>';
            
            body.innerHTML = html;
            modal.classList.add('active');
        }

        // Event Listeners
        document.getElementById('searchInput').addEventListener('input', filterPlatforms);
        document.getElementById('categoryFilter').addEventListener('change', filterPlatforms);
        document.getElementById('sortBy').addEventListener('change', filterPlatforms);
        document.getElementById('compareBtn').addEventListener('click', showComparison);
        document.getElementById('closeModal').addEventListener('click', () => {
            document.getElementById('detailModal').classList.remove('active');
        });
        document.getElementById('closeCompareModal').addEventListener('click', () => {
            document.getElementById('compareModal').classList.remove('active');
        });

        // Fechar modais ao clicar fora
        window.addEventListener('click', (e) => {
            if (e.target.classList.contains('modal')) {
                e.target.classList.remove('active');
            }
        });

        function filterPlatforms() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const category = document.getElementById('categoryFilter').value;
            const sortBy = document.getElementById('sortBy').value;

            let filtered = platforms.filter(platform => {
                const matchesSearch = platform.name.toLowerCase().includes(searchTerm) ||
                                     platform.description.toLowerCase().includes(searchTerm);
                const matchesCategory = category === 'all' || platform.category === category;
                return matchesSearch && matchesCategory;
            });

            // Ordenação
            if (sortBy === 'name') {
                filtered.sort((a, b) => a.name.localeCompare(b.name));
            } else if (sortBy === 'price') {
                filtered.sort((a, b) => {
                    const priceA = getMinPrice(a);
                    const priceB = getMinPrice(b);
                    return priceA - priceB;
                });
            } else if (sortBy === 'price-desc') {
                filtered.sort((a, b) => {
                    const priceA = getMinPrice(a);
                    const priceB = getMinPrice(b);
                    return priceB - priceA;
                });
            }

            renderPlatforms(filtered);
        }

        function getMinPrice(platform) {
            const firstModel = Object.keys(platform.pricing)[0];
            const pricing = platform.pricing[firstModel];
            if (pricing.price) return pricing.price;
            if (pricing.input) return pricing.input;
            return Infinity;
        }

        // Inicialização
        renderPlatforms(platforms);

        // Alternância de tema
        const themeToggle = document.getElementById('themeToggle');
        let isDark = localStorage.getItem('theme') === 'dark';

        function updateTheme() {
            document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
            themeToggle.textContent = isDark ? '☀️' : '🌙';
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        }

        // Inicializar tema
        updateTheme();

        themeToggle.addEventListener('click', () => {
            isDark = !isDark;
            updateTheme();
        });
    </script>
</body>
</html>
